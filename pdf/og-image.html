<!DOCTYPE html>
<!-- Fonte da imagem de compartilhamento (assets/og-image.png, 1200x630). Para regerar, veja o README. -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      font-family: "Noto Sans", "Open Sans", Arial, sans-serif; color: #e9ecf5;
      background:
        radial-gradient(700px 420px at 92% 8%, rgba(129, 140, 248, .35), transparent 70%),
        radial-gradient(600px 380px at 0% 100%, rgba(34, 211, 238, .18), transparent 70%),
        #0b0e17;
      padding: 72px 84px; display: flex; flex-direction: column;
    }
    .logo {
      width: 76px; height: 76px; border-radius: 18px; display: grid; place-items: center;
      background: linear-gradient(135deg, #6366f1, #06b6d4); color: #fff; font-weight: 700; font-size: 32px;
    }
    h1 { margin-top: 44px; font-size: 84px; line-height: 1; letter-spacing: -.02em; font-weight: 700; }
    .role { margin-top: 18px; font-size: 40px; font-weight: 600; color: #a5b4fc; }
    .stack { margin-top: 26px; font-size: 27px; color: #aab1c6; }
    .footer {
      margin-top: auto; display: flex; justify-content: space-between; align-items: center;
      font-size: 24px; color: #8b93ab; border-top: 1px solid #232b41; padding-top: 26px;
    }
    .footer strong { color: #e9ecf5; font-weight: 600; }
  </style>
</head>
<body>
  <div class="logo">FF</div>
  <h1>Fábio Fila</h1>
  <p class="role">Desenvolvedor Back-End</p>
  <p class="stack">PHP · Laravel · APIs REST · Integrações · Redis · AWS</p>
  <div class="footer">
    <span><strong>+25 anos</strong> de experiência</span>
    <span>curriculo.fabiofila.com.br</span>
  </div>
</body>
</html>
